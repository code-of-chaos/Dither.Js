name: Debug npm token

on:
    workflow_dispatch:

jobs:
    diagnose:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  registry-url: "https://registry.npmjs.org"

            - name: Who am I
              run: |
                  npm whoami || echo "whoami failed with exit $?"
                  npm ping || echo "ping failed with exit $?"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Stage list probe
              run: npm stage list || echo "stage list failed with exit $?"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
